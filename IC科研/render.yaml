services:
  - type: web
    name: ic-research-copilot-api
    runtime: docker
    plan: free
    rootDir: IC科研/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-5-mini
